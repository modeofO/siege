services:
  katana:
    image: ghcr.io/dojoengine/dojo:v1.8.0
    platform: linux/amd64
    entrypoint: /opt/asdf/installs/katana/1.7.0/bin/katana
    command: --dev --dev.no-fee --http.addr 0.0.0.0 --http.cors_origins "*"
    ports:
      - "5050:5050"

  builder:
    build:
      context: .
      dockerfile: Dockerfile.build
    platform: linux/amd64
    volumes:
      - .:/app
      # Persist the scarb registry cache — without it every run re-clones
      # dojo/openzeppelin from GitHub, which trips anonymous-clone rate
      # limits on busy days ("failed to clone ... exit status: 128").
      - scarb-cache:/root/.cache/scarb
    profiles:
      - tools

  torii:
    image: ghcr.io/dojoengine/dojo:v1.8.0
    platform: linux/amd64
    entrypoint: /opt/asdf/installs/torii/1.8.3/bin/torii
    command: >-
      --world ${WORLD_ADDRESS}
      --rpc http://katana:5050
      --http.addr 0.0.0.0
      --http.cors_origins "*"
      --indexing.controllers
    ports:
      - "8080:8080"
    depends_on:
      - katana

  # Self-hosted Sepolia indexer (Cartridge stopped accepting new slot torii
  # deployments). Point the frontend at http://localhost:8081 via
  # NEXT_PUBLIC_TORII_URL. DB persists in the torii-sepolia-db volume.
  torii-sepolia:
    image: ghcr.io/dojoengine/dojo:v1.8.0
    platform: linux/amd64
    entrypoint: /opt/asdf/installs/torii/1.8.3/bin/torii
    command: >-
      --config /app/torii_sepolia.toml
      --db-dir /data
      --http.addr 0.0.0.0
      --http.cors_origins "*"
    volumes:
      - .:/app
      - torii-sepolia-db:/data
    ports:
      - "8081:8080"
    profiles:
      - sepolia

volumes:
  torii-sepolia-db:
  scarb-cache:
