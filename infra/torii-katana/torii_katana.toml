rpc = "https://siege-katana-production.up.railway.app"
world_address = "0x031b19dadbea8c6f16b623de37f0085bb898a721f1ed0d52b3f2cdb1353dab73"

# Key names verified against torii 1.8.3 with `--dump-config`; the published
# Torii config docs use older names that this version silently ignores.
# `world_block` belongs under [indexing] (top level is dropped), pending-block
# indexing is `preconfirmed` (not `index_pending`), CORS is
# [server].http_cors_origins (not [indexing].allowed_origins), and historical
# models live under [sql] (not [events]).
[indexing]
world_block = 0
preconfirmed = true
polling_interval = 1000
contracts = [
  # AbilityToken (ERC-1155) — katana deployment, scripts/init-katana-world.ts
  "erc1155:0x60159dd1eb29a2aef41134b6ac536f551769f6238100cd34fc9d50875f226e2",
  # Resource tokens (ERC-20): iron, linen, stone, wood, ember, seeds
  "erc20:0x3ec5e18038345d363133443d25f742d063f34319ba923ac1c9d354054209095",
  "erc20:0x412a69d1b3ab113e6427ce92070c911995de6d31f7453940f82ea025b9d2bac",
  "erc20:0x39af623e54128504f833728cf09fbd98835d825be4eb3a553d9186cab0c39d3",
  "erc20:0x6f0245a8b9605beb8c68da8deda7382e8a794346eef1f49416e01f2d99cba34",
  "erc20:0x68d51f72cad08dd349467877a22ee2ae3a31f0c343a111087211777f4074099",
  "erc20:0x6033ae1569611e683d42a3bcd73f7f5cf519ce5bce02e2e7b4235fecc559739",
]

[server]
# Also passed as --http.cors_origins in the Dockerfile, which takes precedence.
http_cors_origins = ["*"]

[sql]
# Keep every ConquestResolved emission queryable (attack/defense activity feed).
historical = ["siege_dojo-ConquestResolved"]
